<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shop<span>Hub Admin</span></h1>
    <!-- Go to Shop button -->
    <button class="go-shop-btn" onclick="goToShop()">Go to Shop 🛒</button>
  </header>

  <main>
    <h2>Add New Product</h2>
    <input type="text" id="prodName" placeholder="Product Name">
    <input type="number" id="prodPrice" placeholder="Price">
    <input type="text" id="prodImage" placeholder="Image URL">
    <button onclick="addProduct()">Add Product</button>

    <h2>Existing Products</h2>
    <div id="existing-products"></div>
  </main>

  <script src="admin.js"></script>
  <script>
    function goToShop() {
      window.location.href = "index.html"; // Redirect to customer shop page
    }
  </script>
</body>
</html>
